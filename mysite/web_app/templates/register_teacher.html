<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Teacher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .form-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 40px; max-width: 600px; margin: 50px auto; }
        .header { background: linear-gradient(45deg, #4e54c8, #8f94fb); color: white; padding: 20px; border-radius: 15px 15px 0 0; text-align: center; margin: -40px -40px 30px -40px; }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="header">
            <h2><i class="fas fa-user-plus"></i> Register New Teacher</h2>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="e.g. 9876543210" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-book"></i> Subject Taught</label>
                <input type="text" name="subject" class="form-control" placeholder="e.g. Mathematics" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="fas fa-id-card"></i> Roll / Teacher ID</label>
                <input type="text" name="roll" class="form-control" placeholder="e.g. T001" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-lg btn-primary">
                    <i class="fas fa-user-plus"></i> Register Teacher
                </button>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary btn-lg ms-3">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </form>
    </div>
</body>
</html>
