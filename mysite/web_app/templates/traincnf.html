<!DOCTYPE html>
<html>
<head>
    <title>Training Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f8f0; min-height: 100vh; display: flex; align-items: center; }
        .card { max-width: 500px; margin: auto; text-align: center; padding: 40px; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="card shadow">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if 'success' in message.tags %}alert-success{% else %}alert-danger{% endif %}">
                    <h4>{{ message }}</h4>
                </div>
            {% endfor %}
        {% endif %}
        <a href="{% url 'teacher_dashboard' %}" class="btn btn-primary btn-lg mt-3">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
